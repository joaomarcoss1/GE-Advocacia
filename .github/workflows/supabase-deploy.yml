name: Supabase — aplicar banco e funções
# Manual (Actions > "Supabase — aplicar banco e funções" > Run workflow).
# Segredos necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL        string de conexão do banco. Use a do POOLER ("Session pooler", porta 5432):
#                          os runners do GitHub não têm IPv6 e a conexão direta (db.<ref>.supabase.co) é só IPv6.
#   SUPABASE_ACCESS_TOKEN  (opcional) token pessoal, só para publicar as Edge Functions.
#   SUPABASE_PROJECT_REF   (opcional) zkyxvwdxyocgneizcfiz
# Segredos das integrações (opcionais; só os que existirem são enviados às funções, nunca aparecem no log):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET   credencial OAuth do Google Cloud (Agenda e Drive)
#   ALLOWED_ORIGINS                          endereço(s) do site, ex.: https://ge-advocacia.vercel.app
#   DATAJUD_API_KEY, CRON_SECRET             acompanhamento de processos
# A chave de cifra dos tokens (GOOGLE_TOKEN_KEY) é criada sozinha na primeira vez e NUNCA é trocada depois.
# Nada aqui usa a service_role no front-end; os segredos só existem neste workflow.
on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: 'E-mail (já criado em Authentication > Users) a promover a administrador da plataforma'
        required: false
        type: string
      publicar_funcao:
        description: 'Publicar as Edge Functions (anexos, google-agenda, processos e documentos)'
        required: false
        default: false
        type: boolean

permissions: { contents: read }
concurrency: supabase-deploy

jobs:
  banco:
    runs-on: ubuntu-latest
    env:
      DB: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Confere o segredo
        run: |
          if [ -z "$DB" ]; then echo "::error::Cadastre o segredo SUPABASE_DB_URL"; exit 1; fi
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Aplica o schema (idempotente, pode rodar mais de uma vez)
        run: psql "$DB" -X -v ON_ERROR_STOP=1 -q -f supabase/atualizacao_definitiva.sql
      - name: Versão do esquema e tabelas
        run: |
          psql "$DB" -X -At -c "select 'versao='||max(versao) from public.schema_versao"
          psql "$DB" -X -At -c "select 'tabelas public='||count(*) from information_schema.tables where table_schema='public'"
          psql "$DB" -X -At -c "select 'tabelas sem RLS: '||coalesce(string_agg(tablename, ', '), 'nenhuma') from pg_tables where schemaname='public' and not rowsecurity"
      - name: Promove o administrador da plataforma
        if: ${{ inputs.admin_email != '' }}
        env:
          EMAIL: ${{ inputs.admin_email }}
        run: |
          psql "$DB" -X -v ON_ERROR_STOP=1 -v email="$EMAIL" <<'SQL'
          insert into public.plataforma_admins (id, nome, email)
          select id, coalesce(raw_user_meta_data->>'nome', split_part(email, '@', 1)), email
          from auth.users where lower(email) = lower(:'email')
          on conflict (id) do update set ativo = true;
          select case when count(*) = 0 then 'ERRO: usuário não encontrado em Authentication' else 'ok: administrador da plataforma' end
          from public.plataforma_admins where lower(email) = lower(:'email');
          SQL

  funcao:
    if: ${{ inputs.publicar_funcao }}
    needs: banco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Publica as funções (a autorização é feita dentro delas, ver config.toml)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy anexos --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy google-agenda --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy processos --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase functions deploy documentos --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Cadastra os segredos das funções (só os informados) e cria a chave de cifra
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          # chave PÚBLICA do DataJud divulgada pelo CNJ; um segredo cadastrado tem prioridade
          DATAJUD_API_KEY: ${{ secrets.DATAJUD_API_KEY || 'cDZHYzlZa0JadVREZDJCendQbXY6SkJlTzNjLV9TRENyQk1RdnFKZGRQdw==' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          args=()
          for n in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET ALLOWED_ORIGINS DATAJUD_API_KEY CRON_SECRET; do
            if [ -n "${!n}" ]; then args+=("$n=${!n}"); else echo "• $n não informado (pulado)"; fi
          done
          # chave de cifra dos tokens do Google: criada uma única vez; trocar invalidaria as contas já conectadas
          if supabase secrets list --project-ref "$REF" | grep -q "GOOGLE_TOKEN_KEY"; then
            echo "✓ GOOGLE_TOKEN_KEY já existe (mantida)"
          else
            args+=("GOOGLE_TOKEN_KEY=$(openssl rand -base64 32)")
            echo "✓ GOOGLE_TOKEN_KEY criada"
          fi
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set "${args[@]}" --project-ref "$REF" >/dev/null && echo "✓ segredos enviados"; fi
          echo "Endereço de retorno para o Google Cloud (URIs de redirecionamento autorizados):"
          echo "  https://$REF.supabase.co/functions/v1/google-agenda"
          echo "  https://$REF.supabase.co/functions/v1/documentos"
