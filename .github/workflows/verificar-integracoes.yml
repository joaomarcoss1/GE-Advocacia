name: Verificar integrações
# Manual (Actions > "Verificar integrações" > Run workflow). Testa, com a internet do GitHub, o DataJud, o DJEN e as funções do Supabase.
# Não grava nada. Segredos opcionais: DATAJUD_API_KEY, SUPABASE_URL, SUPABASE_ANON_KEY.
on:
  workflow_dispatch:
    inputs:
      processo:
        description: 'Número CNJ de um processo seu (opcional) para testar a leitura de andamentos'
        required: false
        type: string
      todos_tribunais:
        description: 'Testar os 91 endpoints do DataJud (precisa de DATAJUD_API_KEY)'
        required: false
        default: true
        type: boolean
      oab_numero:
        description: 'Número da OAB (opcional) para testar o DJEN'
        required: false
        type: string
      oab_uf:
        description: 'UF da OAB (ex.: MA)'
        required: false
        type: string

permissions: { contents: read }

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Chave PÚBLICA do DataJud, divulgada pelo CNJ (datajud-wiki.cnj.jus.br/api-publica/acesso). Se existir o segredo, ele tem prioridade.
      DATAJUD_API_KEY: ${{ secrets.DATAJUD_API_KEY || 'cDZHYzlZa0JadVREZDJCendQbXY6SkJlTzNjLV9TRENyQk1RdnFKZGRQdw==' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      PROCESSO: ${{ inputs.processo }}
      TODOS_TRIBUNAIS: ${{ inputs.todos_tribunais && '1' || '0' }}
      OAB_NUMERO: ${{ inputs.oab_numero }}
      OAB_UF: ${{ inputs.oab_uf }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/verificar-integracoes.mjs
